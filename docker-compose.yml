services:
  app:
    container_name: "tutorial_app"
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./app:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    container_name: "tutorial_db" 
    image: postgres:17.5
    environment:
      - TZ=Asia/Tokyo
    env_file:
      - .env
    volumes:
      - ./db-data:/var/lib/postgresql/data

volumes:
  db-data:
    driver: local